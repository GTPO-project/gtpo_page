name: Publish GTPO website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Validate static JavaScript
        run: |
          for file in dist/js/*.js; do node --check "$file"; done
          test -s dist/index.html
          test -s dist/assets/gtpo-paper.pdf
          test -s dist/assets/videos/solder-component-2x-v2.mp4
          test -s dist/assets/videos/drive-screw-2x-v2.mp4
          test -s dist/assets/videos/stack-blocks-2x-v1.mp4
          test -s dist/assets/videos/insert-battery-2x-v1.mp4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
